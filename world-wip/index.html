<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Threetopia — world coming soon</title>
  <meta name="description" content="A world in the making. We're bringing creators' work together into one shared world. Threetopia is a work in progress — coming soon." />
  <meta name="theme-color" content="#faf8f4" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="world-page">
    <header class="world-header">
      <a class="brand" href="https://threetopia.com/" aria-label="Threetopia home">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <use href="/brand-mark.svg#mark" />
        </svg>
        <span class="brand-wordmark">threetopia</span>
      </a>
      <span class="world-status"><span aria-hidden="true"></span> Work in progress</span>
    </header>

    <main class="world">
      <div class="world-copy">
        <p class="world-eyebrow">Coming soon</p>
        <h1 tabindex="-1">A world in<br /> <em>the making.</em></h1>
        <p class="world-description">We're bringing creators’ work together into one shared world. Threetopia isn't ready to explore just yet.</p>
        <a class="world-return" href="https://threetopia.com/">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
          Back to Threetopia
        </a>
      </div>
    </main>

    <footer class="world-footer">One world. Many creators.</footer>
</body>
</html>
