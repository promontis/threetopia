<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lagoon — Threetopia map</title><meta name="robots" content="noindex"><link rel="icon" href="/favicon.svg" type="image/svg+xml"></head>
<body>
  <main class="tile-study" aria-label="Lagoon map tile">
    <div class="tile-canvas" role="region" tabindex="0" aria-label="Lagoon map" aria-describedby="map-help"></div>
    <header class="map-header"><a href="/map/" aria-label="Back to the world map">←</a><div><h1>Lagoon Tree Village</h1><p>Threetopia · map study</p></div></header>
    <div class="compass" aria-hidden="true">N<span>↑</span></div>
    <p class="map-status" role="status" data-status>Loading Lagoon…</p>
    <p id="map-help" class="sr-only">Drag or use the arrow keys to pan. Scroll, pinch or use plus and minus to zoom. Press 0 to center the tile. Press Space to pause or resume animation.</p>
    <footer class="map-footer">
      <div class="map-credit">Lagoon by <a href="https://lagoon-tree-village-creatures.netlify.app/" target="_blank" rel="noopener">cryptomanavan</a></div>
      <nav class="map-controls" aria-label="Map controls">
        <button type="button" data-motion aria-pressed="true">Pause</button><i aria-hidden="true"></i>
        <button type="button" data-out aria-label="Zoom out">−</button>
        <button type="button" data-reset aria-label="Center the whole Lagoon tile">Whole tile</button>
        <button type="button" data-in aria-label="Zoom in">+</button>
      </nav>
    </footer>
  </main>
  <script type="module" src="/src/tiles/lagoon/preview.ts"></script>
</body></html>
